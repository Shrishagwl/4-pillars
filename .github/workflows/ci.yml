name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [templates/fastapi-service, services/engine, services/twin, eval]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    name: Docker Compose builds and starts
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Every service answers /health
        run: |
          for port in 8081 8082 8083 8084 8085; do
            curl -fsS "http://localhost:$port/health"; echo
          done
          curl -fsS -o /dev/null -w "dashboard %{http_code}\n" http://localhost:3000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
