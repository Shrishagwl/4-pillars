[project]
name = "evaluation"
version = "0.1.0"
description = "Offline evaluation: seeded twin runs, baselines, metrics, ablations"
requires-python = ">=3.12"
dependencies = ["engine", "twin"]

[tool.uv.sources]
engine = { path = "../services/engine", editable = true }
twin = { path = "../services/twin", editable = true }

[project.scripts]
pillars-eval = "evaluation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
